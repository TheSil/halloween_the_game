<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maps</title><style>
:root{--bg:#0c0c0f;--panel:#17171c;--line:#2b2b34;--bone:#ece5d6;--mute:#8f8b85;--pumpkin:#ff7a1a;--blood:#d0202e;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050506}
body{font-family:Bahnschrift,'DIN Alternate','Segoe UI',Arial,sans-serif;color:var(--bone);padding:14px;display:flex;justify-content:center}
.stack{display:inline-flex;flex-direction:column;gap:14px}
nav{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
nav a{font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:9px 16px;border-radius:8px}
nav a:hover{color:var(--bone)}
nav a.on{color:#1a1200;background:var(--pumpkin)}
.sheet{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;
 background:radial-gradient(520px 200px at 100% 0,rgba(255,122,26,.20),transparent 70%),var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.wic{height:34px;width:77px;opacity:.9;background:center/contain no-repeat}
.ic{background:center/contain no-repeat}
h1{font-stretch:condensed;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
main{padding:10px 12px 12px;display:grid;gap:6px;align-items:stretch}
.rh{display:flex;align-items:center;font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
 padding:0 10px 0 12px;border-left:3px solid var(--pumpkin);color:var(--bone)}
.rh{flex-direction:column;align-items:flex-start;justify-content:center}
.rh small{font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:3px}
.rh.t-Finisher{border-color:#c9c2b2}.rh.t-Fallback{border-color:#8f7bd6}.rh.t-Bloodthirsty{border-color:var(--blood)}
.card{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 8px;min-width:0}
.card .ic{width:30px;height:30px;flex:none;opacity:.85}
.card .nm{font-stretch:condensed;font-size:14px;line-height:1.05;font-weight:600;text-transform:uppercase;flex:1;min-width:0;overflow-wrap:anywhere}
.card .nm small{display:block;font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-bottom:2px}
.card .t{font-stretch:condensed;font-size:27px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .t i{font-style:normal;font-size:12px;color:var(--mute);margin-left:1px;font-weight:400}
.card.best{border-color:var(--bone);background:#22222a;box-shadow:0 0 0 1px rgba(236,229,214,.75)}
.card.best .ic{opacity:1}
.card.best .nm{color:#fff}
.card:not(.best):not(.empty) .nm{color:#b9b3a6}
.card.ctx{padding:7px 10px 7px 12px}
.sheet.alt{border-color:#26262c;background:#0b0b0d}
.sheet.alt header{border-color:#26262c}
.sheet.alt h1,.sheet.alt .rh{color:#a9a49a}
.sheet.alt .wic{opacity:.55}
.sheet.alt .rh{border-left-color:#4a4a52 !important}
.sheet.alt .card{background:#131317;border-color:#26262c}
.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.best{border-color:#3a3a42;background:#15151a;box-shadow:none}
.sheet.alt .card.best .nm,.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.empty{background:transparent;border:1px dashed #1b1b20}
.card.empty{background:transparent;border:1px dashed #1c2c33}
.card.empty{background:transparent;border:1px dashed #22222a}
footer{padding:0 16px 10px;font-size:10px;color:var(--mute);letter-spacing:.06em;display:flex;gap:14px;align-items:center}
footer i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-right:5px;vertical-align:-1px}
footer span:last-child{margin-left:auto}

.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.bar .lbl{font-stretch:condensed;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 4px}
.bar button{font:inherit;font-stretch:condensed;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
 color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;display:inline-flex;align-items:center;gap:8px}
.bar button:hover{color:var(--bone)}
.bar button.on{color:var(--bone);border-color:var(--bone);background:#22222a}
.bar button .sw{width:11px;height:11px;border-radius:50%;background:var(--c);opacity:.35}
.bar button.on .sw{opacity:1;box-shadow:0 0 8px var(--c)}
.bar button .li{width:20px;height:20px;opacity:.4}
.bar button.on .li{opacity:1}
.bar button .n{font-weight:400;color:var(--mute);letter-spacing:0}
.maprow{display:flex;gap:10px;align-items:flex-start;width:942px;max-width:100%}
.side{flex:none;width:186px;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.side .lbl{font-stretch:condensed;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding:2px 4px 4px}
.side button{font:inherit;font-stretch:condensed;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left;
 color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;width:100%}
.side button:hover{color:var(--bone)}
.side .allnone{display:flex;gap:6px;margin-bottom:2px}
.side .allnone button{justify-content:center;font-size:12px;padding:5px 6px;border-width:1px}
.side button{border-width:2px}
.side button.on{color:var(--bone);border-color:var(--c);background:#22222a}
.side button .li{width:20px;height:20px;opacity:.4}.side button.on .li{opacity:1}
.side button .sw{width:11px;height:11px;border-radius:50%;background:var(--c);opacity:.35}.side button.on .sw{opacity:1}
.side button .n{font-weight:400;color:var(--mute);letter-spacing:0;margin-left:auto}
@media(max-width:700px){.maprow{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;align-self:stretch}.side button{width:auto}.side .lbl{width:100%}}
.mapwrap{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#050506;line-height:0}
.mapwrap img{width:100%;height:auto;display:block}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mk text{font:700 15px Bahnschrift,'Segoe UI',Arial,sans-serif;fill:#0b0b0d;text-anchor:middle;dominant-baseline:central}
.empty-note{font-size:13px;color:var(--mute);padding:0 6px}

const state = {map: 0, on: {}};
DATA.layers.forEach(l => state.on[l.id] = true);
(function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const m = DATA.maps.findIndex(x => x.id === h.get('map')); if (m >= 0) state.map = m;
  if (h.has('layers')) { const on = h.get('layers').split(',').filter(Boolean); DATA.layers.forEach(l => state.on[l.id] = on.includes(l.id)); }
})();
function writeHash(){
  const on = DATA.layers.filter(l => state.on[l.id]).map(l => l.id).join(',');
  history.replaceState(null, '', '#map=' + DATA.maps[state.map].id + '&layers=' + on);
}
function marker(l, p, i){
  const x = p.x * 1000, y = p.y * 1000;
  if (l.kind === 'icon') {
    const has = p.a !== undefined, r = (has ? p.a : 45) * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r);
    const tip = p.p ? `<title>${l.name} placed here in the level</title>` : p.s === undefined ? '' : `<title>${p.s >= 1 ? 'Only ' + l.name + ' can appear here' : l.name + ': ' + Math.round(p.s * 100) + '%'}</title>`;

      <circle r="21" fill="#15151a" stroke="${l.color}" stroke-width="2.5"/>
      <image href="${l.icon}" x="-21" y="-21" width="42" height="42"/></g>`;

    return `<g class="mk" transform="translate(${x} ${y})"><g transform="rotate(${p.a})">

function render(){
