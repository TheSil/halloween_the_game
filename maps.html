    `<button class="${i === state.map ? 'on' : ''}" data-map="${i}">${x.name}${x.nw || ''}</button>`).join('');
  const count = l => (m.layers[l.id] || []).length + m.spots.filter(sp => sp.l.includes(l.id)).length;
  const by = {}; DATA.layers.forEach(l => by[l.id] = l);
  const GCOL = {michael: '#e0454f', objectives: '#ffb060', weapons: '#e8d44d'};
  if (!DATA.groups.some(g => g.id === state.tab)) state.tab = DATA.groups[0].id;
  const g = DATA.groups.find(x => x.id === state.tab), gc = GCOL[g.id] || '#888';
  const onN = gr => gr.layers.filter(id => state.on[id]).length;
  const tabs = DATA.groups.map(x => { const n = onN(x);
    return `<button class="tab${x.id === g.id ? ' cur' : ''}" data-tab="${x.id}" style="--g:${GCOL[x.id] || '#888'}">${x.name}<span class="bd${n ? ' on' : ''}">${n}</span></button>`; }).join('');
  const n = onN(g), tot = g.layers.length;
  const tiles = g.layers.map(id => { const l = by[id];
    return `<button class="tile${state.on[id] ? ' on' : ''}" data-layer="${id}" style="--c:${l.color}" title="${l.name}${l.per ? ' · ' + l.per + ' spawn per match' : ''}">
      ${l.nw || (m.chg || {})[id] || ''}<span class="tc">${count(l)}</span><span class="ti"><img src="${l.icon}" alt=""></span><span class="tn">${l.short}</span></button>`; }).join('');
  const active = DATA.layers.filter(l => state.on[l.id]);
  const chips = active.length ? active.map(l => `<button class="chip" data-off="${l.id}" style="--c:${l.color}" title="Hide ${l.name}"><i></i>${l.name}<b>×</b></button>`).join('')
                              : '<span class="none">Nothing selected. Pick layers above.</span>';
  document.getElementById('layers').innerHTML = `<div class="tabs">${tabs}</div>
    <div class="pane" style="--g:${gc}"><div class="ph"><span>${g.sub}</span>
      <button class="gt ${n === tot ? 'full' : n ? 'part' : ''}" data-group="${g.id}">${n === tot ? 'Hide all' : 'Show all'} · ${n}/${tot}</button></div>
      <div class="tiles">${tiles}</div></div>
    <div class="act"><span class="al">On the map</span>${chips}</div>`;
  document.getElementById('mapimg').src = m.img;
  document.getElementById('mapimg').alt = m.name;
  const defs = `<defs><marker id="ah-entry" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f8cff"/></marker>
    <marker id="ah-exit" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fc0ff"/></marker></defs>`;
  document.getElementById('overlay').innerHTML = defs + '<g id="route"></g>' +
    m.spots.filter(sp => sp.l.some(id => state.on[id])).map(spotMarker).join('') +
    DATA.layers.filter(l => state.on[l.id]).map(l => (m.layers[l.id] || []).map((p, i) => marker(l, p, i)).join('')).join('');
  writeHash();
}
const tipEl = document.getElementById('tip');
function hideTip(){ tipEl.style.display = 'none'; tipEl.dataset.pin = ''; showRoute(null); }
function showTip(g){
  showRoute(g);
  const wrap = tipEl.parentElement.getBoundingClientRect(), r = g.getBoundingClientRect();
  tipEl.innerHTML = TIPS[+g.dataset.t]; tipEl.style.display = 'block';
  const cx = r.left + r.width / 2 - wrap.left, cy = r.top + r.height / 2 - wrap.top, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = cx + 20; if (left + w > wrap.width - 6) left = cx - 20 - w;
  let top = cy - 18; if (top + h > wrap.height - 6) top = wrap.height - 6 - h;
  tipEl.style.left = Math.max(6, left) + 'px'; tipEl.style.top = Math.max(6, top) + 'px';
}
const overlay = document.getElementById('overlay');
overlay.addEventListener('mouseover', e => { const g = e.target.closest('.mk'); if (g && !tipEl.dataset.pin) showTip(g); });
overlay.addEventListener('mouseout', e => { if (!tipEl.dataset.pin && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.mk'))) hideTip(); });
overlay.addEventListener('click', e => {            // tap / click pins the card (for touch screens); click elsewhere releases it
  const g = e.target.closest('.mk'); hideTip(); if (g) { showTip(g); tipEl.dataset.pin = '1'; }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.map !== undefined) state.map = +b.dataset.map;
  else if (b.dataset.layer) state.on[b.dataset.layer] = !state.on[b.dataset.layer];
  else if (b.dataset.tab) state.tab = b.dataset.tab;
  else if (b.dataset.off) state.on[b.dataset.off] = false;
  else if (b.dataset.group) { const g = DATA.groups.find(x => x.id === b.dataset.group), all = g.layers.every(id => state.on[id]); g.layers.forEach(id => state.on[id] = !all); }
  else if (b.dataset.all !== undefined) DATA.layers.forEach(l => state.on[l.id] = b.dataset.all === '1');
  else return;
  render();
});
render();
</script></body></html>
