<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maps</title><style>
:root{--bg:#0c0c0f;--panel:#17171c;--line:#2b2b34;--bone:#ece5d6;--mute:#8f8b85;--pumpkin:#ff7a1a;--blood:#d0202e;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050506}
body{font-family:Bahnschrift,'DIN Alternate','Segoe UI',Arial,sans-serif;color:var(--bone);padding:14px;display:flex;justify-content:safe center}

html{scrollbar-gutter:stable}
.stack{display:flex;flex-direction:column;align-items:safe center;gap:14px;width:min(1194px,100%);flex-shrink:0}
.stack>nav{align-self:stretch}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
nav a{font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:9px 16px;border-radius:8px}
nav a:hover{color:var(--bone)}
nav a.on{color:#1a1200;background:var(--pumpkin)}
nav .navnew{display:inline-block;margin-left:8px;padding:2px 6px 1px;border-radius:5px;background:var(--blood);color:#fff;font-size:11.5px;line-height:1.1;letter-spacing:.06em;vertical-align:2px}
.sheet{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;
 background:radial-gradient(520px 200px at 100% 0,rgba(255,122,26,.20),transparent 70%),var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.wic{height:34px;width:77px;opacity:.9;background:center/contain no-repeat}
.ic{background:center/contain no-repeat}
h1{font-stretch:condensed;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
main{padding:10px 12px 12px;display:grid;gap:6px;align-items:stretch}
.rh{display:flex;align-items:center;font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
 padding:0 10px 0 12px;border-left:3px solid var(--pumpkin);color:var(--bone)}
.rh{flex-direction:column;align-items:flex-start;justify-content:center}
.rh small{font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:3px}
.rh.t-Finisher{border-color:#c9c2b2}.rh.t-Fallback{border-color:#8f7bd6}.rh.t-Bloodthirsty{border-color:var(--blood)}
.card{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 8px;min-width:0}
.card .ic{width:30px;height:30px;flex:none;opacity:.85}
.card .nm{font-stretch:condensed;font-size:14px;line-height:1.05;font-weight:600;text-transform:uppercase;flex:1;min-width:0;overflow-wrap:anywhere}
.card .nm small{display:block;font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-bottom:2px}
.card .t{font-stretch:condensed;font-size:27px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .t i{font-style:normal;font-size:12px;color:var(--mute);margin-left:1px;font-weight:400}
.card.best{border-color:var(--bone);background:#22222a;box-shadow:0 0 0 1px rgba(236,229,214,.75)}
.card.best .ic{opacity:1}
.card.best .nm{color:#fff}
.card:not(.best):not(.empty) .nm{color:#b9b3a6}
.card.ctx{padding:7px 10px 7px 12px}
.sheet.alt{border-color:#26262c;background:#0b0b0d}
.sheet.alt header{border-color:#26262c}
.sheet.alt h1,.sheet.alt .rh{color:#a9a49a}
.sheet.alt .wic{opacity:.55}
.sheet.alt .rh{border-left-color:#4a4a52 !important}
.sheet.alt .card{background:#131317;border-color:#26262c}
.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.best{border-color:#3a3a42;background:#15151a;box-shadow:none}
.sheet.alt .card.best .nm,.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.empty{background:transparent;border:1px dashed #1b1b20}
.card.empty{background:transparent;border:1px dashed #1c2c33}
.card.empty{background:transparent;border:1px dashed #22222a}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:12px;align-self:stretch}
.wgrid header{gap:10px;padding:10px 12px 9px}
.wgrid h1{font-size:23px}
.wgrid h1 .nw{font-size:11px;margin-left:8px;vertical-align:3px;padding:3px 6px 2px}
.wgrid .wic{width:54px;height:26px;flex:none}
main.wl{display:flex;flex-direction:column;gap:5px;padding:4px 10px 12px}
main.wl .rh{padding:9px 0 2px 9px;font-size:12px;letter-spacing:.14em;border-left-width:3px;margin-top:4px}
main.wl .rh small{display:inline;margin:0 0 0 6px}
.wgrid .card{padding:6px 9px 6px 7px}
.wgrid .card .t{font-size:24px}

main.ctxl{display:block;columns:5 200px;column-gap:6px}
main.ctxl .card{break-inside:avoid;margin-bottom:6px}
.sheet.full{align-self:stretch}
footer{padding:0 16px 10px;font-size:10px;color:var(--mute);letter-spacing:.06em;display:flex;gap:14px;align-items:center}
footer i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-right:5px;vertical-align:-1px}
footer span:last-child{margin-left:auto}

.nw{display:inline-block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;line-height:1;padding:3px 6px 2px;border-radius:4px;
 background:var(--gold);color:#1a1200;text-transform:uppercase;vertical-align:middle;white-space:nowrap;font-stretch:normal}
.nw.chg{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.nwb{display:block;margin-bottom:4px;line-height:1}
h1 .nw{font-size:14px;margin-left:12px;vertical-align:6px;padding:4px 8px 3px}
.nwl{display:flex;align-items:center;gap:6px;margin-left:auto;padding:0 10px;font-size:11px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}

.stack{max-width:100%;align-items:stretch}      
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.bar .lbl{font-stretch:condensed;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 4px}
.bar button{font:inherit;font-stretch:condensed;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
 color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;display:inline-flex;align-items:center;gap:8px}
.bar button:hover{color:var(--bone)}
.bar button.on{color:var(--bone);border-color:var(--bone);background:#22222a}
.bar{box-sizing:border-box;flex-wrap:nowrap}
.bar button{flex:1 1 auto;justify-content:center;padding:8px 6px;letter-spacing:.05em;font-size:13px;white-space:nowrap}
@media(max-width:700px){.bar{flex-wrap:wrap}}
.bar button .sw{width:11px;height:11px;border-radius:50%;background:var(--c);opacity:.35}
.bar button.on .sw{opacity:1;box-shadow:0 0 8px var(--c)}
.bar button .li{width:20px;height:20px;opacity:.4}
.bar button.on .li{opacity:1}
.bar button .n{font-weight:400;color:var(--mute);letter-spacing:0}
.maprow{display:flex;gap:12px;align-items:flex-start}
.maprow .mapwrap{flex:0 1 942px;min-width:0}
.side{flex:none;width:240px;position:sticky;top:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 8px 10px}
.side .dh{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
.side .lbl{font-stretch:condensed;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.side .allnone{margin-left:auto;display:flex;gap:6px}
.side .allnone button{font:inherit;font-stretch:condensed;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
 color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
.side .allnone button:hover{color:var(--bone);border-color:#55555f}
.gh{margin:12px 4px 6px;padding-top:9px;border-top:1px solid var(--line);font-stretch:condensed;font-weight:700;font-size:12px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--g)}
.gh:first-child{border-top:0;margin-top:2px;padding-top:0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px}

.shr{grid-column:1/-1;display:grid;grid-template-columns:inherit;gap:5px;padding:5px;border:1px dashed #3a3a44;border-radius:11px}
.shr .shl{grid-column:1/-1;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:var(--mute);padding:1px 4px 0}
.lr{font:inherit;cursor:pointer;display:flex;align-items:center;gap:9px;padding:5px 9px 5px 5px;min-width:0;text-align:left;
 background:#101014;border:1.5px solid var(--line);border-radius:9px;color:var(--mute);transition:border-color .12s,background .12s}
.lr:hover{border-color:#55555f;color:var(--bone)}
.lr .ti{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#15151a;border:2px solid #3a3a44}
.lr .ti img{width:21px;height:21px;object-fit:contain;opacity:.45;filter:grayscale(.6)}
.lr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lr .tn{font-stretch:condensed;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .tn .nw{font-size:9px;padding:2px 4px 1px;margin-left:5px;vertical-align:1px}
.lr .ts{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:var(--mute);line-height:1.1}
.lr .tc{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute)}
.lr.on{color:#fff;border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,#101014),#101014 80%)}
.lr.on .ti{border-color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 50%,transparent)}
.lr.on .ti img{opacity:1;filter:none}
.lr.on .tc{color:var(--bone)}
.bar button .nw{font-size:9px;padding:2px 4px 1px}

.bar{gap:8px;padding:8px}
.bar button.mb{position:relative;flex:1 1 0;min-width:0;height:76px;padding:0;overflow:hidden;align-items:flex-end;justify-content:flex-start;
 background:#000 var(--t) center/cover no-repeat;border:2px solid var(--line);border-radius:9px;filter:saturate(.55) brightness(.62);transition:filter .15s,border-color .15s}
.bar button.mb::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.85))}
.bar button.mb:hover{filter:saturate(.85) brightness(.9);border-color:#55555f}
.bar button.mb.on{filter:none;border-color:var(--pumpkin);box-shadow:0 0 12px rgba(255,122,26,.35)}
.bar button.mb .mn{position:relative;display:block;width:100%;padding:0 9px 7px;color:#fff;text-shadow:0 1px 3px #000;font-size:var(--mf,13px);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-align:left;line-height:1.1}
.bar.wrap button.mb .mn{white-space:normal;text-wrap:balance}
.bar button.mb .nw{position:absolute;top:6px;right:6px}
@media(max-width:700px){.bar button.mb{flex:1 1 140px;height:62px}}

 border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.5)}

.basesw button.on .th{filter:none}
