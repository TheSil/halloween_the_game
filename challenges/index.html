<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenges</title><style>
:root{--bg:#0c0c0f;--panel:#17171c;--line:#2b2b34;--bone:#ece5d6;--mute:#8f8b85;--pumpkin:#ff7a1a;--blood:#d0202e;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050506}
body{font-family:Bahnschrift,'DIN Alternate','Segoe UI',Arial,sans-serif;color:var(--bone);padding:14px;display:flex;justify-content:safe center}

html{scrollbar-gutter:stable}
.stack{display:flex;flex-direction:column;align-items:safe center;gap:14px;width:min(1194px,100%);flex-shrink:0}
.stack>nav{align-self:stretch}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
nav a{font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mute);padding:9px 16px;border-radius:8px}
nav a:hover{color:var(--bone)}
nav a.on{color:#1a1200;background:var(--pumpkin)}
.sheet{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;
 background:radial-gradient(520px 200px at 100% 0,rgba(255,122,26,.20),transparent 70%),var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.wic{height:34px;width:77px;opacity:.9;background:center/contain no-repeat}
.ic{background:center/contain no-repeat}
h1{font-stretch:condensed;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
main{padding:10px 12px 12px;display:grid;gap:6px;align-items:stretch}
.rh{display:flex;align-items:center;font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
 padding:0 10px 0 12px;border-left:3px solid var(--pumpkin);color:var(--bone)}
.rh{flex-direction:column;align-items:flex-start;justify-content:center}
.rh small{font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:3px}
.rh.t-Finisher{border-color:#c9c2b2}.rh.t-Fallback{border-color:#8f7bd6}.rh.t-Bloodthirsty{border-color:var(--blood)}
.card{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 8px;min-width:0}
.card .ic{width:30px;height:30px;flex:none;opacity:.85}
.card .nm{font-stretch:condensed;font-size:14px;line-height:1.05;font-weight:600;text-transform:uppercase;flex:1;min-width:0;overflow-wrap:anywhere}
.card .nm small{display:block;font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-bottom:2px}
.card .t{font-stretch:condensed;font-size:27px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .t i{font-style:normal;font-size:12px;color:var(--mute);margin-left:1px;font-weight:400}
.card.best{border-color:var(--bone);background:#22222a;box-shadow:0 0 0 1px rgba(236,229,214,.75)}
.card.best .ic{opacity:1}
.card.best .nm{color:#fff}
.card:not(.best):not(.empty) .nm{color:#b9b3a6}
.card.ctx{padding:7px 10px 7px 12px}
.sheet.alt{border-color:#26262c;background:#0b0b0d}
.sheet.alt header{border-color:#26262c}
.sheet.alt h1,.sheet.alt .rh{color:#a9a49a}
.sheet.alt .wic{opacity:.55}
.sheet.alt .rh{border-left-color:#4a4a52 !important}
.sheet.alt .card{background:#131317;border-color:#26262c}
.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.best{border-color:#3a3a42;background:#15151a;box-shadow:none}
.sheet.alt .card.best .nm,.sheet.alt .card .nm{color:#a9a49a}
.sheet.alt .card.empty{background:transparent;border:1px dashed #1b1b20}
.card.empty{background:transparent;border:1px dashed #1c2c33}
.card.empty{background:transparent;border:1px dashed #22222a}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:12px;align-self:stretch}
.wgrid header{gap:10px;padding:10px 12px 9px}
.wgrid h1{font-size:23px}
.wgrid h1 .nw{font-size:11px;margin-left:8px;vertical-align:3px;padding:3px 6px 2px}
.wgrid .wic{width:54px;height:26px;flex:none}
main.wl{display:flex;flex-direction:column;gap:5px;padding:4px 10px 12px}
main.wl .rh{padding:9px 0 2px 9px;font-size:12px;letter-spacing:.14em;border-left-width:3px;margin-top:4px}
main.wl .rh small{display:inline;margin:0 0 0 6px}
.wgrid .card{padding:6px 9px 6px 7px}
.wgrid .card .t{font-size:24px}

main.ctxl{display:block;columns:5 200px;column-gap:6px}
main.ctxl .card{break-inside:avoid;margin-bottom:6px}
.sheet.full{align-self:stretch}
footer{padding:0 16px 10px;font-size:10px;color:var(--mute);letter-spacing:.06em;display:flex;gap:14px;align-items:center}
footer i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-right:5px;vertical-align:-1px}
footer span:last-child{margin-left:auto}

.nw{display:inline-block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;line-height:1;padding:3px 6px 2px;border-radius:4px;
 background:var(--gold);color:#1a1200;text-transform:uppercase;vertical-align:middle;white-space:nowrap;font-stretch:normal}
.nw.chg{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.nwb{display:block;margin-bottom:4px;line-height:1}
h1 .nw{font-size:14px;margin-left:12px;vertical-align:6px;padding:4px 8px 3px}
.nwl{display:flex;align-items:center;gap:6px;margin-left:auto;padding:0 10px;font-size:11px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}


.chip{display:inline-flex;align-items:center;gap:4px;font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-size:11.5px;letter-spacing:.06em;
 text-transform:uppercase;padding:2px 7px 1px;border-radius:999px;border:1px solid #3c5a40;color:#9fe0a6;background:rgba(111,220,122,.06);white-space:nowrap}
.chip.b{border-color:#5a4530;color:#ffc58a;background:rgba(255,122,26,.08)}
.chip b{font-weight:700;color:#ffe2c2;margin-left:2px}
.sub{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;color:var(--mute);line-height:1.45;padding:10px 16px 0}
.scale{padding:14px 16px 16px}
.bar8{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.bar8 .tz{padding:8px 8px 7px;border-radius:7px;min-width:0;font-family:'Segoe UI',Arial,sans-serif;
 display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:0;align-content:start}      
.bar8 .tz b{display:block;font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.bar8 .tz i{display:block;font-style:normal;font-size:11px;opacity:.85;margin-top:3px;line-height:1.2}
.bar8 .tz i em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.bar8 .tz span{display:block;align-self:end;font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--bone)}
.tz.h{background:rgba(90,150,230,var(--a));color:#cfe2ff}.tz.k{background:rgba(208,32,46,var(--a));color:#ffd3d6}
.tz.on{outline:2px solid var(--bone);outline-offset:1px}
.scale .ends{display:flex;justify-content:space-between;font-stretch:condensed;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:7px}
@media(max-width:800px){.bar8{grid-template-columns:repeat(3,1fr)}}
.tally{padding:6px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:900px){.tally{grid-template-columns:minmax(0,1fr)}}
.tl{display:flex;flex-direction:column}
.tl .grh{font-stretch:condensed;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px;display:flex;justify-content:space-between}
.tl .grh:first-child{margin-top:4px}
.tr{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:8px;background:#121216;margin-bottom:3px}
.tr .w{font-stretch:condensed;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--bone)}
.tr .w small{display:block;font-family:'Segoe UI',Arial,sans-serif;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:1px}
.tr .cs{display:flex;flex-wrap:wrap;gap:4px}
.tr .p{font-stretch:condensed;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
.tr .p small{display:block;font-family:'Segoe UI',Arial,sans-serif;font-weight:400;font-size:11px;color:var(--mute)}
.tr.neg .p{color:#ff8a90}
@media(max-width:600px){.tr{grid-template-columns:minmax(0,1fr) auto}.tr.ed{grid-template-columns:minmax(0,1fr) auto 32px}.tr .cs{grid-column:1/-1;grid-row:2}}
.side2{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:12px}
.sum{border:1px solid var(--line);border-radius:11px;padding:14px;background:#111115}
.sum .k{font-stretch:condensed;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sum .big{font-stretch:condensed;font-weight:700;font-size:54px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.sum .vd{font-stretch:condensed;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:#ff9a9f}
.sum .vd small{display:block;font-family:'Segoe UI',Arial,sans-serif;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:3px}
.sum ul{margin:12px 0 0 16px;font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;color:#c9c3b6;line-height:1.45}
.sum .rows{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-family:'Segoe UI',Arial,sans-serif;font-size:13px}
.sum .rows div{display:flex;justify-content:space-between;padding:2px 0;color:#c9c3b6}
.sum .rows b{font-variant-numeric:tabular-nums;color:var(--bone)}
#rm header{justify-content:space-between}
.edb{display:flex;gap:6px}
.edb button,.addk{font:inherit;font-stretch:condensed;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--bone);
 background:#17171c;border:1.5px solid var(--line);border-radius:8px;padding:7px 14px}
.edb button:hover,.addk:hover{border-color:#55555f}
.edb button.pri{color:#1a1200;background:var(--pumpkin);border-color:var(--pumpkin)}
.sub b{color:#c9c3b6}
.tr select{font:inherit;font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:var(--bone);background:#1b1b21;border:1px solid var(--line);border-radius:6px;padding:2px 4px;margin:3px 4px 0 0}
.tr .w select.vic{font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;margin:0;display:block}
.chip.off{border-style:dashed;border-color:#3a3a44;color:#77736d;background:transparent}
.chip.ed{cursor:pointer;font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.chip.ed:hover{border-color:#6fdc7a;color:#c8f2cd}
.chip.ed:disabled{opacity:.28;cursor:not-allowed}
.chip.ed.lock{cursor:default}
@media(min-width:601px){.tr.ed{grid-template-columns:minmax(150px,auto) minmax(0,1fr) 125px 32px}}
.del{cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #5a2a2e;
 background:rgba(208,32,46,.12);color:#ff9a9f;padding:0}
.del:hover{background:rgba(208,32,46,.3);border-color:#a03038;color:#fff}
.del svg{width:16px;height:16px}
.fate{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fate button{font:inherit;font-family:Bahnschrift,'Segoe UI',sans-serif;font-stretch:condensed;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
 cursor:pointer;background:#17171c;color:var(--mute);border:0;padding:5px 10px}
.fate button+button{border-left:1px solid var(--line)}
.fate button.on{background:rgba(208,32,46,.22);color:#ffd3d6}
.fate.bon button.on{background:rgba(111,220,122,.2);color:#c8f2cd}
.tr.pos .p{color:#8fe39a}
.fate button i{font-style:normal;font-weight:400;opacity:.8;margin-left:5px}
.tl .none{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;color:var(--mute);padding:4px 8px 6px}
.adds{display:flex;flex-wrap:wrap;gap:4px;margin:1px 0 4px}
.edb .addk,.addk{font-size:12px;padding:5px 12px 5px 8px;display:inline-flex;align-items:center;gap:7px;color:#9fe0a6;border-color:#3c5a40;background:rgba(111,220,122,.08)}
.addk:hover{color:#fff;border-color:#6fdc7a;background:rgba(111,220,122,.18)}
.addk b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#6fdc7a;color:#0c1a0e;font-size:15px;line-height:1;font-weight:700}
.sum .rows button{font:inherit;cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);padding:0 6px;margin-left:6px;font-size:12px}
.sum .rows button.on{color:#9fe0a6;border-color:#3c5a40}
.sum .lnk{font:inherit;cursor:pointer;background:none;border:0;color:var(--pumpkin);padding:0;text-decoration:underline}
.tip{border:1px solid #5a4530;border-radius:11px;padding:12px 14px;background:rgba(255,122,26,.07)}
.tip .k{font-stretch:condensed;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pumpkin)}
.tip ul{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;line-height:1.5;color:#c9c3b6;margin:6px 0 0 16px}.tip li+li{margin-top:6px}.tip b{color:var(--bone);font-weight:600}

.sheet.chp{align-self:stretch}
.chp .hero{padding:16px 16px 10px}
.srch{position:relative}
.srch input{width:100%;font-family:Bahnschrift,'Segoe UI',sans-serif;font-size:20px;color:var(--bone);background:#111115;border:2px solid #5a4530;border-radius:10px;padding:12px 104px 12px 16px;outline:none}
.srch input:focus{border-color:var(--pumpkin);box-shadow:0 0 0 3px rgba(255,122,26,.16)}
.srch input::placeholder{color:#67635d}
.srch output{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-stretch:condensed;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 16px;background:#141418;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar a{font-stretch:condensed;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.bar a:hover{color:var(--pumpkin)}.bar select{margin-left:auto;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:var(--bone);background:#17171c;border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
.sec{margin:0 12px 18px;padding:0 16px 18px;background:#0f0f13;border:1px solid #3d3226;border-radius:12px;scroll-margin-top:56px}.sec:first-child{margin-top:16px}.sec:last-child{margin-bottom:14px}
.sec>h2{margin:0 -16px 10px;padding:12px 16px;background:linear-gradient(90deg,#3a2413,#1a1510 70%);border-bottom:1px solid #3d3226;border-left:4px solid var(--pumpkin);border-radius:11px 11px 0 0;font-stretch:condensed;font-size:25px;letter-spacing:.04em;text-transform:uppercase;color:var(--bone)}
.sec>p{margin:3px 0 12px;font-family:'Segoe UI',Arial,sans-serif;font-size:13.5px;line-height:1.45;color:var(--mute)}
.rowh{margin:16px 0 8px;font-stretch:condensed;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--pumpkin)}
.rowh small{font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--mute);margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chp .card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;cursor:pointer;background:#141418;border:1px solid var(--line);border-radius:8px;padding:6px 4px 7px;color:var(--bone);font:inherit;text-align:center}
.chp .card:hover{border-color:#7a5230}.chp .card.on{border-color:var(--pumpkin);background:#1f1812}
.chp .card img{display:block;flex:none;height:88px;max-width:100%;margin:0 0 5px;object-fit:contain}
.chp .card b{display:flex;align-items:center;justify-content:center;min-height:2.2em;font-stretch:condensed;font-weight:600;font-size:13px;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:6px}
.bdg{display:grid;grid-template-columns:48px minmax(0,1fr);gap:9px;align-items:center;width:100%;cursor:pointer;background:#141418;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--bone);font:inherit;text-align:left}
.bdg:hover{border-color:#7a5230}.bdg.on{border-color:var(--pumpkin);background:#1f1812}
.bdg img{width:48px;height:48px;object-fit:contain}
.bdg b{display:block;font-stretch:condensed;font-weight:600;font-size:14px;line-height:1.12}
.bdg small{display:block;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.pan{margin-top:10px;background:#111116;border:1px solid #4a3a28;border-radius:10px;padding:14px;scroll-margin-top:56px}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:12px}.ph img{height:62px;width:auto}
.ph h3{margin:0;font-stretch:condensed;font-size:22px;letter-spacing:.03em}.ph p{margin:2px 0 0;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:var(--mute)}
.ph p a,.lk{color:#ffc58a;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:2px}
.lvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;align-items:stretch}.lv{display:contents}
.lv>h4{margin:0 -22px 7px 0;padding:7px 24px 7px 26px;background:#2c1d12;font-stretch:condensed;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%,13px 50%)}
.lv:first-child>h4{padding-left:12px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}
.lv:nth-child(2)>h4{background:#4a2e16}
.lv:last-child>h4{margin-right:0;background:#6e4016;color:#ffe3a8;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,13px 50%)}
.stp{position:relative;display:flex;flex-direction:column;background:#17171c;border:1px solid var(--line);border-radius:8px;padding:8px 28px 9px 32px}.stp .rew{margin-top:auto;padding-top:6px}
.stp.flash,.trw.flash,.pan.flash,.pl.flash,.pst li.flash{animation:fl 1.8s ease-out}@keyframes fl{0%,40%{background:#4a2c12}}
.stp>i{position:absolute;left:9px;top:8px;font-style:normal;font-stretch:condensed;font-weight:700;font-size:15px;color:var(--pumpkin)}
.stp h5{margin:0 0 2px;font-stretch:condensed;font-weight:600;font-size:15.5px;line-height:1.15;color:#fff}
.stp p{margin:0;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.35;color:#d9d3c6}
.nmx{color:var(--gold);font-weight:600}
.rew{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.cur{font-stretch:condensed;font-size:12.5px;color:#ffc58a;font-variant-numeric:tabular-nums;margin-right:3px;white-space:nowrap}
.it{display:inline-flex;align-items:center;gap:5px;max-width:100%;background:#22222a;border:1px solid #33333d;border-radius:6px;padding:2px 6px;font-family:'Segoe UI',Arial,sans-serif;font-size:11.5px;line-height:1.2;color:#d9d3c6}
.it img{width:30px;height:30px;object-fit:cover;border-radius:3px;margin:-1px 0 -1px -4px}.it em{font-style:normal;color:var(--mute)}

 return `<div class="pan" data-k="Prestige.${c.key}"><div class="ph">${c.ic?`<img src="../img/ch/${c.ic}" alt="">`:''}<div><h3>${esc(c.n)} Prestige</h3></div></div>
 ${c.lv.length?`<div class="plh">Rewards</div><div class="pls">${c.lv.map(v=>`<div class="pl" data-k="pl.${c.key}.${v.l}"><b>Prestige ${v.l}</b><div class="rew" style="margin:0">${v.r.map(it).join('')}</div></div>`).join('')}</div>`:''}
 ${rows.length?`<div class="plh">Possible challenges</div><ul class="pst">${rows.map((r,i)=>`<li data-k="pt.${c.key}.${i}">${text(r.t)}${nt(r)}</li>`).join('')}</ul>`:''}</div>`}
function browse(){let h='<section class="sec" id="progressive"><h2>Progressive challenges</h2><p>One card per Michael skin, civilian and weapon, each with three collections. The game shows only the current step, here you see all of them with their rewards. Texts are copied from the game: <b style="color:var(--pumpkin)">!</b> marks a text that differs from what really counts.</p>';
 for(const side of ['Killer','Civilian','Weapon']){const cs=D.prog.filter(c=>c.side===side),open=cs.find(c=>c.key===S.c);
  h+=`<div class="rowh">${side==='Killer'?'Michael':side==='Civilian'?'Civilians':'Weapons'}</div><div class="cards">${cs.map(c=>`<button class="card${c.key===S.c?' on':''}" data-c="${c.key}">${c.ic?`<img loading="lazy" src="../img/ch/${c.ic}" alt="">`:''}<b>${esc(c.n)}</b></button>`).join('')}</div>${open?panelC(open):''}`}
 h+='</section><section class="sec" id="passive"><h2>Passive challenges</h2><p>Always running. Each badge has five tiers. Groups open at the player level shown.</p>';
 for(const side of ['Killer','Civilian']){h+=`<div class="rowh" style="font-size:15px">${side==='Killer'?'Michael':'Civilians'}</div>`;
  for(const g of D.pas.filter(x=>x.side===side)){const open=g.badges.find(b=>b.key===S.b);
   h+=`<div class="rowh">${esc(g.n)}<small>${g.lv?'from level '+g.lv:'open from the start'}</small></div><div class="badges">${g.badges.map(b=>`<button class="bdg${b.key===S.b?' on':''}" data-b="${b.key}">${b.ic?`<img loading="lazy" src="../img/ch/${b.ic}" alt="">`:'<span></span>'}<span><b>${esc(b.n)}</b><small>${b.tiers.map(t=>num(t.g)).join(' · ')}</small></span></button>`).join('')}</div>${open?panelB(open,g):''}`}}
 h+=`</section><section class="sec" id="prestige"><h2>Prestige challenges</h2><p>Started by the player for a weapon, Michael, a civilian or the profile, with a time limit. X is the goal.</p>${['Profile','Michael','Civilians','Weapons'].map((t,i)=>{const cs=D.prest.filter(c=>c.row===i),open=cs.find(c=>c.key===S.p);return `<div class="rowh">${t}</div><div class="cards">${cs.map(c=>`<button class="card${c.key===S.p?' on':''}" data-p="${c.key}">${c.ic?`<img loading="lazy" src="../img/ch/${c.ic}" alt="">`:''}<b>${esc(c.n)}</b></button>`).join('')}</div>${open?panelP(open):''}`}).join('')}</section>`;
 return h}
const IDX=[];
D.prog.forEach(c=>c.levels.forEach((l,i)=>l.steps.forEach((s,j)=>IDX.push({k:s.id,o:{c:c.key},ic:c.ic,n:s.n,t:s.t,g:s.g,r:s.r,pp:s.pp,xp:s.xp,warn:s.w,where:`Progressive · ${c.n} · Collection ${i+1}/${c.levels.length}, step ${j+1}`,w:`${s.n} ${s.t} ${c.n} ${c.side==='Weapon'?'':c.side}`}))));
D.pas.forEach(g=>g.badges.forEach(b=>IDX.push({k:b.key,o:{b:b.key},ic:b.ic,n:b.n,t:b.t,g:undefined,gl:b.tiers.map(t=>num(t.g)).join(' / '),r:b.tiers.flatMap(t=>t.r).concat(b.r),warn:b.w,where:`Passive · ${g.side==='Killer'?'Michael':'Civilians'} · ${g.n}`,w:`${b.n} ${b.t} ${g.n} ${g.side}`})));
D.prest.forEach(c=>c.lv.forEach(v=>IDX.push({k:`pl.${c.key}.${v.l}`,o:{p:c.key},pr:1,ic:c.ic,n:`${c.n} Prestige ${v.l}`,t:'',r:v.r,warn:[],where:'Prestige rewards',w:`${c.n} prestige`})));
Object.entries(D.ptasks).forEach(([g,rows])=>{const c=D.prest.find(x=>x.g===g),civ=g==='Civilian';rows.forEach((r,i)=>IDX.push({k:`pt.${c.key}.${i}`,o:{p:c.key},ic:civ?'':c.ic,n:'Prestige task',t:r.t,r:[],warn:r.w,where:`Prestige · ${civ?'Civilians':g}`,w:`${r.t} prestige ${g}`}))});
IDX.forEach(e=>{e.ws=words(e.w+' '+e.r.map(i=>D.rw[i].n+' '+D.rw[i].k).join(' '))});
$('kind').innerHTML='<option value="">Any reward</option>'+[...new Set(D.rw.map(r=>r.k))].sort().map(k=>`<option>${esc(k)}</option>`).join('');
function results(q,kind){const s=IDX.filter(e=>q.every(t=>hit(e.ws,t))&&(!kind||e.r.some(i=>D.rw[i].k===kind)));
 $('n').textContent=s.length+' found';
 return s.length?`<div class="res">${s.map(e=>`<button class="hit" data-k="${e.k}" data-o="${esc(JSON.stringify(e.o||{}))}" data-j="${e.j||''}">${e.ic?`<img class="ic" loading="lazy" src="../img/ch/${e.ic}" alt="">`:'<span></span>'}<span><b>${mark(esc(e.n),q)}</b>${nt({w:e.warn},'span')}<small>${esc(e.where)}</small><span class="x">${text(e.t,e.g,q)}</span>${e.r.length?`<div class="rew">${e.r.filter(i=>!kind||D.rw[i].k===kind).slice(0,6).map(it).join('')}</div>`:''}</span><span class="gl">${esc(e.gl||'')}</span></button>`).join('')}</div>`:'<div class="none">Nothing found. Try fewer words.</div>'}
function draw(){const q=words($('q').value).filter(t=>!STOP.has(t)),kind=$('kind').value;
 if(q.length||kind)M.innerHTML=results(q,kind);else{$('n').textContent=IDX.filter(e=>!e.pr).length+' challenges';M.innerHTML=browse()}}
function go(o,k){$('q').value='';$('kind').value='';Object.assign(S,{c:o.c||S.c,b:o.b||null,p:o.p||null});history.replaceState(null,'','#'+(k||o.c||o.b));draw();
 const el=k&&document.querySelector(`[data-k="${k}"]`)||$('pan');if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}
for(const [on,off] of [['mouseover','mouseout'],['focusin','focusout']]){M.addEventListener(on,e=>{const n=e.target.closest('.nt');if(n)tip(n)});M.addEventListener(off,e=>{if(e.target.closest('.nt'))untip()})}
addEventListener('scroll',untip,{passive:true});
M.addEventListener('click',e=>{const n=e.target.closest('.nt');if(n){tip(n);e.stopPropagation();return}
 const t=e.target.closest('[data-c],[data-b],[data-p],[data-go],.hit');if(!t)return;
 if(t.dataset.p){S.p=S.p===t.dataset.p?null:t.dataset.p;history.replaceState(null,'','#'+(S.p?'Prestige.'+S.p:''));draw();return}
 if(t.dataset.c){S.c=S.c===t.dataset.c?null:t.dataset.c;history.replaceState(null,'','#'+(S.c||''));draw()}
 else if(t.dataset.b){S.b=S.b===t.dataset.b?null:t.dataset.b;history.replaceState(null,'','#'+(S.b||''));draw()}
 else if(t.dataset.go){const p=t.dataset.go.split('.');go(p[0]==='Passive'?{b:p.slice(0,4).join('.')}:{c:p.slice(0,3).join('.')},t.dataset.go)}
 else if(t.dataset.j){$('q').value='';$('kind').value='';draw();$(t.dataset.j).scrollIntoView()}
 else go(JSON.parse(t.dataset.o),t.dataset.k)});
document.querySelector('.bar').addEventListener('click',e=>{const a=e.target.closest('[data-j]');if(a){e.preventDefault();$('q').value='';$('kind').value='';draw();$(a.dataset.j).scrollIntoView()}});
$('q').addEventListener('input',draw);$('kind').addEventListener('change',draw);
document.addEventListener('click',untip);
addEventListener('keydown',e=>{if(e.key==='Escape')untip();if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
const h=decodeURIComponent(location.hash.slice(1));
if(h){const p=h.split('.');if(p[0]==='Passive')S.b=p.slice(0,4).join('.');else if(p[0]==='Progressive')S.c=p.slice(0,3).join('.');else if(/^(Prestige|pl|pt)$/.test(p[0]))S.p=p[1]}
draw();if(h){const el=document.querySelector(`[data-k="${h}"]`)||$('pan');if(el)el.scrollIntoView({block:'center'})}
})();
</script></body></html>
